services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goy-table-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "8000:8000"
      - "5173:5173"
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    entrypoint: ["/usr/local/bin/app-entrypoint"]

  postgres:
    image: postgres:16-alpine
    container_name: goy-table-postgres
    environment:
      POSTGRES_DB: goy_table
      POSTGRES_USER: goy_user
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goy_user -d goy_table"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: goy-table-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
